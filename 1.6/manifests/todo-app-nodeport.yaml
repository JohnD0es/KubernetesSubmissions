apiVersion: v1
kind: Service
metadata:
  name: todo-app-nodeport
spec:
  type: NodePort
  selector:
    app: todo-app
  ports:
    - port: 80          # Cluster-internal port
      targetPort: 8080 # Container port
      nodePort: 30080  # External port on every node (must be 30000–32767)
      protocol: TCP
